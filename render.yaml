services:
  - type: web
    name: mathsolver-stable-v2
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: REQUEST_TIMEOUT
        value: "55"
      - key: MAX_CONCURRENT_AI
        value: "4"
      - key: USER_COOLDOWN_SECONDS
        value: "1.2"
      - key: MAX_OUTPUT_TOKENS
        value: "2600"

      - key: DB_PATH
        value: data/mathsolver.db
