services:
  - type: web
    name: mathsolver-v6
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: DATABASE_URL
        value: sqlite:///data/mathsolver.db
      - key: FALLBACK_API_BASE
        sync: false
      - key: FALLBACK_API_KEY
        sync: false
      - key: FALLBACK_MODEL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: REQUEST_TIMEOUT
        value: "55"
      - key: MAX_CONCURRENT_AI
        value: "4"
      - key: USER_COOLDOWN_SECONDS
        value: "1.2"
      - key: MAX_HISTORY_MESSAGES
        value: "8"
      - key: MAX_OUTPUT_TOKENS
        value: "2600"
      - key: MAX_IMAGE_MB
        value: "7"

      - key: ADMIN_WEB_USER
        value: admin
      - key: ADMIN_WEB_PASSWORD
        sync: false

      - key: PAY_SUPPORT_CONTACT
        sync: false
      - key: PREMIUM_GATES_ENABLED
        value: "true"
